name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m venv .venv
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            .venv/bin/python -m pip install -r requirements/locked-py312.txt
          fi
          .venv/bin/python -m pip install -r requirements/dev.txt
          npm ci
      - name: Check Python, JavaScript and tests
        run: make check
      - name: Check pre-commit hooks and secrets
        run: make precommit
